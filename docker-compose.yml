services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server # bản CPU
    container_name: noteai-llm
    # i7-12700H: CPU 0-11 là 6 nhân P (có HT), 12-19 là 8 nhân E.
    # LLM ở nhân P, OCR ở nhân E -> request đồng thời không tranh CPU của nhau.
    cpuset: ${LLM_CPUSET:-0-11}
    command:
      - --hf-repo
      - ${LLM_HF_REPO:-unsloth/Qwen3.5-9B-GGUF}
      - --hf-file
      - ${LLM_HF_FILE:-Qwen3.5-9B-Q4_K_M.gguf}
      - --no-mmproj # chỉ dùng text, không tải vision projector
      - --alias
      - ${MODEL_NAME:-local-llm}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --jinja # dùng chat template của model; phần "thinking" tách ra reasoning_content
      # Decode trên CPU bị giới hạn bởi băng thông RAM: = số nhân P, thêm nhân E/HT thường chậm hơn
      - --threads
      - ${LLM_THREADS:-6}
      # Máy 15GB không đủ giữ LLM (~8GB) và OCR cùng lúc. Pipeline chạy OCR rồi mới LLM, nên khi rảnh
      # thì nhả model ra cho OCR dùng RAM, có request thì nạp lại (~vài giây). Không dùng mlock: khóa
      # weight trong RAM làm OCR bị thrash (đọc lại weight từ đĩa mỗi token, ~1 tok/s).
      - --sleep-idle-seconds
      - ${LLM_SLEEP_IDLE_SECONDS:-60}
      - --ctx-size
      - ${LLM_CTX_SIZE:-32768} # văn bản ~10k token + KB ~5k + prompt + output
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --parallel
      - "1" # CPU chỉ đủ sức cho 1 request: đo với 4 slot tổng tok/s chỉ tăng ~20%
      # Đoán trước token bằng n-gram trong prompt: JSON đầu ra chép nguyên văn từ văn bản nên
      # sinh nhanh hơn ~30% (đo 7.2 -> 9.2 tok/s), không tốn thêm RAM. Qwen3.5 GGUF không có lớp MTP.
      - --spec-type
      - ngram-simple
      # Giới hạn token "suy nghĩ" (Qwen3.5). Trên CPU ~5-10 tok/s nên 8192 token suy nghĩ = 15-25 phút.
      # -1 = không giới hạn, 0 = tắt suy nghĩ.
      - --reasoning-budget
      - ${LLM_REASONING_BUDGET:-1024}
    environment:
      LLAMA_CACHE: /models # không đặt thì llama.cpp tải vào ~/.cache/huggingface trong container (mất khi tạo lại)
    volumes:
      # Thư mục chứa file GGUF trên host (vd ~/scratch/models trên workspace Coder) — tải 1 lần, dùng lại
      - ${LLM_MODELS_DIR:-./models}:/models
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20m # lần đầu phải tải weight (~6GB)
    restart: unless-stopped
  ocr-vl:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: noteai-ocr-vl
    cpuset: ${OCR_CPUSET:-12-19}
    command:
      - --hf-repo
      - PaddlePaddle/PaddleOCR-VL-1.6-GGUF
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --temp
      - "0"
      - --ctx-size
      - "16384" # mặc định 131k x 4 slot rất tốn bộ nhớ; mỗi vùng ảnh chỉ cần vài nghìn token
      - --parallel
      - "2"
      - --threads
      - ${OCR_VL_THREADS:-8}
    environment:
      LLAMA_CACHE: /models
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/models
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m
    restart: unless-stopped

  # OCR self-host: PaddleOCR-VL pipeline (layout chạy CPU, nhận dạng gọi sang ocr-vl).
  # Giữ giao diện POST /v1/ocr/documents -> {"content": ...} của OCR API cũ.
  ocr:
    build: ./ocr_service
    image: noteai-ocr:latest
    container_name: noteai-ocr
    cpuset: ${OCR_CPUSET:-12-19}
    environment:
      OCR_VL_SERVER_URL: http://ocr-vl:8000/v1
    volumes:
      # Weight model layout của PaddleOCR, tải lần đầu khi khởi động
      - ${OCR_MODELS_DIR:-./models/paddlex}:/models
    depends_on:
      ocr-vl:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request;assert json.load(urllib.request.urlopen('http://localhost:8000/health'))['status']=='ok'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m
    restart: unless-stopped

  summarizer:
    build: .
    image: meeting-summarizer:latest
    container_name: meeting-summarizer
    env_file: .env
    environment:
      OPENAI_BASE_URL: http://llm:8000/v1
      OCR_ENDPOINT: http://ocr:8000/v1/ocr/documents
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      llm:
        condition: service_healthy
      ocr:
        condition: service_healthy
    restart: unless-stopped
